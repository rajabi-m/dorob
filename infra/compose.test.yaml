name: dorob-backend-test
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: dorob_test
      POSTGRES_USER: dorob_test
      POSTGRES_PASSWORD: offline-test-only
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorob_test -d dorob_test"]
      interval: 1s
      timeout: 5s
      retries: 60
