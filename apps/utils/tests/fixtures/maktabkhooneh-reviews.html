<script id="__NUXT_DATA__">[{"data":1},{"course-page-آموزش-برنامه-نویسی-با-پایتون-مقدماتی-mk346":2},{"courseDetails":3,"courseDetailsStatus":62,"chapterData":63,"courseReviews":1629,"courseReviewsNext":1660,"courseReviewsCount":1661},{"id":4,"slug_id":5,"title":6,"heading":7,"type":8,"level":9,"price":10,"discounted_price":14,"full_course_sale":18,"course_content_sale":19,"content_hours":20,"required_hours":21,"avg_rating":22,"rating_count":23,"unit_count":24,"student_count":25,"publish_status":26,"ongoing":27,"image_thumbnail_url":28,"latest_update_date":29,"description":30,"prerequisite_description":31,"learning_goals":32,"teachers":37,"course_features":40},10465,346,"آموزش برنامه نویسی جامع پایتون","از مبانی پایتون تا شیءگرایی و کار با داده‌ها پیش بروید و با تمرین و پروژه، برنامه‌های کاربردی و سازمان‌یافته بسازید.","PLUS","مقدماتی تا پیشرفته",{"FULL":11,"CONTENT":12,"UPGRADE":13},2599000,1599000,999000,{"FULL":15,"CONTENT":16,"UPGRADE":17},1169550,719550,999000,true,true,17,74,4.7,21979,82,268555,"NORMAL_PUBLISH",false,"https://media1.maktabkhooneh.org/CACHE/images/courses/images/Python-Jadi-2_1403-12-13-113008363/3b93e9d629dc333cc648387a996d35db.webp?expire=4893471932&token=94fb7de009a85c6b8a27e6bce14262e9&md5=lPt94AmoXGuKJ-a84UJi6Q==",null,"<p>آموزش پایتون مقدماتی مکتب خونه فرصتی استثنایی برای ورود به دنیای برنامه&zwnj;نویسی است که با آموزش جادی، یکی از متخصصین نام&zwnj;آشنا و حرفه&zwnj;ای این حوزه، ارائه می&zwnj;شود. در این دوره، شما از سطح صفر و به صورت قدم&zwnj;به&zwnj;قدم با مفاهیم پایتون آشنا می&zwnj;شوید و مهارت لازم برای نوشتن برنامه&zwnj;های کاربردی، تحلیل داده&zwnj;ها و اجرای پروژه&zwnj;های مختلف را با این زبان کسب می&zwnj;کنید. همین حالا می&zwnj;توانید با ثبت&zwnj;نام در آموزش جامع جادی، اولین قدم&zwnj;های حرفه&zwnj;ای خود را در برنامه&zwnj;نویسی بردارید.</p>\r\n<h2>معرفی دوره پایتون جادی</h2>\r\n<p>آموزش پایتون با جادی یک آموزش جامع و کاربردی است که شما را از سطح مقدماتی تا مفاهیم متوسط و نسبتا پیشرفته&zwnj; پایتون هدایت می&zwnj;کند. در این مسیر آموزشی، مباحث اصلی برنامه&zwnj;نویسی با زبان پایتون، ساختارهای داده و <a href=\"https://maktabkhooneh.org/learn/python-libraries/\">کار با کتابخانه&zwnj;های پایتون</a> را به صورت عملی یاد می&zwnj;گیرید و توانایی پیاده&zwnj;سازی پروژه&zwnj;های واقعی به این زبان را پیدا می&zwnj;کنید. با شرکت در این دوره، علاوه بر کسب مهارت&zwnj;های پایه، آماده استفاده از پایتون در تحلیل داده، توسعه وب و پروژه&zwnj;های عملی خواهید شد. به&zwnj;طور خلاصه این دوره، نقطه شروعی مطمئن برای ورود به دنیای حرفه&zwnj;ای برنامه&zwnj;نویسی است. پس از این دوره اگر می خواهید در مورد پایتون بیشتر آموزش ببینید و توانایی های خود را افزایش دهید می توانید به دسته بندی <a href=\"https://maktabkhooneh.org/learn/python/\" target=\"_blank\" rel=\"noopener\">آموزش پایتون</a> مکتب خونه مراجعه کنید.</p>\r\n<h2>دوره آموزش پایتون جامع جادی برای چه کسانی مناسب است؟</h2>\r\n<ul>\r\n<li>افراد مبتدی که هیچ تجربه&zwnj;ای در برنامه&zwnj;نویسی ندارند و می&zwnj;خواهند اصول پایتون را از صفر یاد بگیرند؛</li>\r\n<li>دانشجویانی که می&zwnj;خواهند مهارت&zwnj;های برنامه&zwnj;نویسی خود را تقویت کنند و پایه&zwnj;ای محکم در پایتون داشته باشند؛</li>\r\n<li>کارجویانی که قصد تغییر مسیر شغلی و ورود به دنیای تکنولوژی دارند؛</li>\r\n<li>شاغلان و کارمندانی که به دنبال ارتقای مهارت&zwnj;های دیجیتال و برنامه&zwnj;نویسی هستند؛</li>\r\n<li>علاقه&zwnj;مندان به توسعه مهارت&zwnj;های حرفه&zwnj;ای در حوزه فناوری و علوم کامپیوتر که می&zwnj;خواهند آماده ورود به پروژه&zwnj;ها و بازار کار شوند.</li>\r\n</ul>\r\n<h2>پایتون چیست و چه کاربردی دارد؟</h2>\r\n<p>پایتون یک زبان برنامه&zwnj;نویسی قدرتمند و در عین حال ساده است که در زمینه&zwnj;های مختلفی مانند توسعه وب، تحلیل داده&zwnj;ها، هوش مصنوعی و خودکارسازی وظایف کاربرد دارد. اهمیت پایتون در سادگی یادگیری و انعطاف&zwnj;پذیری بالای آن است که باعث می&zwnj;شود حتی مبتدیان نیز بتوانند سریع وارد دنیای برنامه&zwnj;نویسی شوند و تسلط بر این زبان، مسیر شما را برای فعالیت حرفه&zwnj;ای در حوزه&zwnj;های فناوری، علوم داده و توسعه نرم&zwnj;افزار هموار می&zwnj;کند و فرصت&zwnj;های شغلی گسترده&zwnj;ای برایتان ایجاد می&zwnj;کند.</p>\r\n<h2>سرفصل&zwnj;ها و مباحث اصلی دوره آموزش مقدماتی پایتون</h2>\r\n<ul>\r\n<li>نصب و راه&zwnj;اندازی پایتون و کار با محیط&zwnj;های برنامه&zwnj;نویسی؛</li>\r\n<li>مبانی ساختارهای داده، عملگرهای مقایسه&zwnj;ای و دستورهای شرطی و حلقه&zwnj;ها؛</li>\r\n<li>توابع، متدها و برنامه&zwnj;نویسی شیءگرا در پایتون؛</li>\r\n<li>ماژول&zwnj;ها، پکیج&zwnj;ها، ارور هندلینگ، دکوراتورها و جنریتورها؛</li>\r\n<li>کار با فایل&zwnj;ها، داده&zwnj;ها، عکس&zwnj;ها، وب اسکریپینگ و ماژول&zwnj;های وب؛</li>\r\n<li>ساختارهای داده پیشرفته پایتون و اجرای پروژه پایان دوره.</li>\r\n</ul>\r\n<h2>بعد از گذراندن آموزش پایتون جادی چه مهارت&zwnj;هایی کسب می&zwnj;کنید؟</h2>\r\n<ul>\r\n<li>شما قادر خواهید بود پایتون و محیط&zwnj;های توسعه آن را نصب و راه&zwnj;اندازی کنید و سریع شروع به کدنویسی کنید؛</li>\r\n<li>با استفاده از ساختارهای داده، حلقه&zwnj;ها، شرط&zwnj;ها و توابع می&zwnj;توانید مسائل مختلف را حل کنید و برنامه&zwnj;های متنوع و کاربردی بنویسید؛</li>\r\n<li>با مهارت برنامه&zwnj;نویسی شیءگرا، می&zwnj;توانید نرم&zwnj;افزارهای سازمان&zwnj;یافته و مقیاس&zwnj;پذیر طراحی کنید؛</li>\r\n<li>می&zwnj;توانید خطاها را مدیریت کنید و از ماژول&zwnj;ها، پکیج&zwnj;ها، دکوراتورها و جنریتورها در پروژه&zwnj;ها استفاده کنید؛</li>\r\n<li>مهارت کار با فایل&zwnj;ها، داده&zwnj;ها، عکس&zwnj;ها و اجرای وب اسکریپینگ را برای پروژه&zwnj;های عملی به دست خواهید آورد.</li>\r\n</ul>\r\n<h2>مزایا و فرصت&zwnj;های شغلی مرتبط با دوره جامع پایتون جادی</h2>\r\n<ul>\r\n<li>شرکت در این دوره، مهارت&zwnj;های برنامه&zwnj;نویسی شما را تقویت می&zwnj;کند و شما را برای ورود به پروژه&zwnj;های عملی آماده می&zwnj;سازد؛</li>\r\n<li>یادگیری پایتون فرصت دسترسی به بازار کار گسترده را فراهم می&zwnj;کند و امکان فعالیت در حوزه&zwnj;هایی مثل توسعه وب، داده&zwnj;کاوی و هوش مصنوعی را به شما می&zwnj;دهد؛</li>\r\n<li>مهارت&zwnj;های کسب&zwnj;شده در دوره پایتون مقدماتی جادی، مزیت رقابتی قابل توجهی در رزومه شما ایجاد می&zwnj;کند؛</li>\r\n<li>تجربه و راهنمایی&zwnj;های مدرس حرفه&zwnj;ای دوره، جادی پایتون را برای شما آسان می&zwnj;سازد، مسیر یادگیری شما را هموار می&zwnj;کند و باعث ارتقای مهارت&zwnj;های حرفه&zwnj;ای شما می&zwnj;شود؛</li>\r\n<li>توانایی نوشتن کدهای کاربردی با پایتون، شانس موفقیت شما را در پروژه&zwnj;های واقعی و همکاری با تیم&zwnj;های فنی و حرفه&zwnj;ای افزایش می&zwnj;دهد.</li>\r\n</ul>\r\n<p><strong>جمع&zwnj;بندی</strong></p>\r\n<p>با گذراندن دوره پایتون جادی مکتب خونه، شما تمام مبانی و مفاهیم کاربردی پایتون را به صورت گام&zwnj;به&zwnj;گام فرا می&zwnj;گیرید و آماده اجرای پروژه&zwnj;های واقعی خواهید شد. این دوره جادی پایتون را به شما آموزش می&zwnj;دهد، مهارت&zwnj;های عملی برنامه&zwnj;نویسی شما را تقویت می&zwnj;کند و به شما در هموارساختن مسیر حرفه&zwnj;ای&zwnj;تان در دنیای تکنولوژی کمک می&zwnj;کند. همین حالا با ثبت&zwnj;نام در این دوره، اولین قدم خود را در مسیر تبدیل شدن به یک برنامه&zwnj;نویس حرفه&zwnj;ای بردارید.</p>\r\n<div id=\"highlighter--hover-tools\" style=\"display: none;\">\r\n<div id=\"highlighter--hover-tools--container\">\r\n<div class=\"highlighter--icon highlighter--icon-copy\" title=\"Copy\">&nbsp;</div>\r\n<div class=\"highlighter--icon highlighter--icon-change-color\" title=\"Change Color\">&nbsp;</div>\r\n<div class=\"highlighter--icon highlighter--icon-delete\" title=\"Delete\">&nbsp;</div>\r\n</div>\r\n</div>\r\n<div id=\"gtx-trans\" style=\"position: absolute; left: 849px; top: 144.2px;\">\r\n<div class=\"gtx-trans-icon\">&nbsp;</div>\r\n</div>","<p>این دوره به نحوی تهیه و تدوین شده است که مباحث آن به ساده&zwnj;ترین شکل ممکن بیان شوند و مخاطبان دوره بتوانند به&zwnj;سادگی متوجه موضوعات مطرح شده شوند. به همین جهت برای شرکت در این دوره هیچ پیش&zwnj;نیاز به خصوصی وجود ندارد و افراد با هر سطحی از آگاهی و تحصیلات می&zwnj;توانند از مباحث این دوره نهایت استفاده را داشته باشند.</p>",[33,34,35,36],"آشنایی با مفاهیم توابع، ماژول‌ها و تست‌نویسی","یادگیری نحوه خواندن و پردازش فایل‌های متنی و اکسل","درک جامع از مباحث برنامه‌نویسی شی‌ءگرا","انجام تمرین‌ها و پروژه‌های واقعی برای رسیدن به سطح پیشرفته",[38],{"full_name":39},"جادی میرمیرانی",[41,44,47,50,53,56,59],{"title":42,"description":43},"گواهی‌نامه مکتب‌خونه","<p>در صورت قبولی در دوره، گواهی نامه رسمی پایان دوره توسط مکتب&zwnj;خونه به اسم شما صادر شده و در اختیار شما قرار می گیرد.</p>\r\n<a href=\"https://maktabkhooneh.org/media/uploads/%DA%AF%D9%88%D8%A7%D9%87%DB%8C_%D9%86%D8%A7%D9%85%D9%87_%D9%85%DA%A9%D8%AA%D8%A8_%D8%AE%D9%88%D9%86%D9%87.jpg\" class=\"button\">مشاهده نمونه گواهینامه</a>",{"title":45,"description":46},"خدمات تصحیح خودکار","<p>تمرین&zwnj;ها و پروژه&zwnj;های شما در این دوره به صورت آنلاین و خودکار ارزیابی شده و&zwnj; در عرض چند دقیقه بازخوردهای آن را دریافت می&zwnj;کنید.</p>",{"title":48,"description":49},"خدمات منتورینگ","<p>خدمات منتورینگ به معنای برخورداری دانشجو از راهنما یا پشتیبان علمی در طول گذراندن دوره می&zwnj;باشد. این خدمات شامل پاسخگویی به سوالات آموزشی(در قالب تیکتینگ)، تصحیح آزمون یا پروژه های دوره و ارائه باز خورد موثر به دانشجو می&zwnj;باشد.</p>",{"title":51,"description":52},"پروژه محور","<p>این دوره طوری طراحی شده است که محتوای آموزشی دوره حول چند پروژه واقعی و کاربردی هستند تا یادگیری دانشجو در طول دوره به کاربردهای عملی تبدیل شود و به این ترتیب بالاترین سطح یادگیری را فراهم نمایند.</p>",{"title":54,"description":55},"تمرین و آزمون","<p>با قرار گرفتن تمرین ها و آزمون های مختلف در طول دوره، محیطی تعاملی فراهم شده است تا بهره گیری از محتوا و یادگیری بهتر و عمیق تر شود.</p>",{"title":57,"description":58},"تالار گفتگو","<p>شما می توانید از طریق تالار گفتگو با دیگر دانشجویان دوره در ارتباط باشید، شبکه روابط حرفه ای خود را تقویت کنید یا سوالات مرتبط با دوره خود را از دیگر دانشجویان بپرسید.</p>",{"title":60,"description":61},"تسهیل استخدام","<p> در صورت قبولی در دوره، شما می‌توانید با وارد کردن اطلاعات آن در بخش دوره‌های آموزشی رزومه‌ساز «<strong>جاب ویژن</strong>»، تایید مهارت خود را در قالب اضافه شدن «<strong>مدال مهارت</strong>» به روزمه آنلاین خود دریافت نمایید. این مدال علاوه بر ایجاد تمایز در نمایش رزومه شما، باعث بالاتر قرار گرفتن آن در لیست انبوه رزومه‌های ارسالی به کارفرما شده و بدین ترتیب شانس شما را برای استخدام در سازمانهای موفق و پر متقاضی افزایش می‌دهد. </p>\r\n\r\n<a
