اپلیکیشن‌های سیستم‌ عامل‌های مختلف، ماشین لرنینگ، علم داده و... استفاده کنید.</p>\r\n<p dir=\"rtl\"><!-- /wp:paragraph --> <!-- wp:paragraph --></p>\r\n<p dir=\"rtl\">بنابراین اگر چنین تصمیمی دارید با دیدن دوره آموزش‌ پایتون می‌توانید به سادگی به هدف خود برسید و راه‌تان در دنیای پایتون را با این دوره شروع کنید.<!-- /wp:paragraph --></p>\r\n<h2 dir=\"rtl\">در این دوره آموزشی با چه موضوعاتی آشنا خواهید شد؟</h2>\r\n<ul dir=\"rtl\">\r\n<li>بررسی پایتون و ویژگی‌های آن</li>\r\n<li>شیوه نصب و پیاده‌سازی ابزارهای مورد نیاز برای توسعه</li>\r\n<li>آشنایی با مفاهیم اولیه برنامه‌نویسی مانند متغیرها، شروط، حلقه و...</li>\r\n<li>کار با ویژگی‌های شئ‌گرایی</li>\r\n<li>کار با ساختارهای داده‌ای</li>\r\n<li>کار با بانک‌های اطلاعاتی</li>\r\n<li>آشنایی با برنامه‌نویسی سوکت</li>\r\n<li>و...</li>\r\n</ul>\r\n<h2 dir=\"rtl\">هدف نهایی دوره</h2>\r\n<p dir=\"rtl\">هدف نهایی دوره آموزشی پایتون این است که شما را با مقدمات پایتون آشنا کنیم و بتوانید به صورت رایگان با ضروری‌ترین موضوعات این زبان برنامه نویسی آشنا شوید. </p></body>"])</script>
