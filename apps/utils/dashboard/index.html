<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرور داده‌های دوره‌ها | دورُب</title><link rel="stylesheet" href="/dashboard.css"><script defer src="/dashboard.js"></script></head>
<body>
<a class="skip" href="#course-detail">رفتن به جزئیات دوره</a>
<header class="topbar"><div><span class="brand">دورُب</span><h1>مرور داده‌های دوره‌ها</h1></div><nav aria-label="ابزارهای داده"><button id="reload" type="button">تازه‌سازی</button><a class="download" href="/download.json" download>دانلود داده‌ها</a></nav></header>
<main>
<section class="snapshot" aria-label="وضعیت جمع‌آوری"><p id="status" role="status" aria-live="polite">در حال خواندن داده‌ها…</p><p id="freshness" class="muted"></p><div id="provider-status" class="provider-status"></div><details id="errors" hidden><summary id="error-summary">خطاهای جمع‌آوری</summary><div id="error-list"></div></details></section>
<div class="workspace">
<aside class="browser" aria-label="انتخاب دوره"><div class="filters"><label for="search">جست‌وجوی دوره</label><input type="search" id="search" placeholder="عنوان، مدرس یا موضوع" dir="auto"><div class="filter-row"><div><label for="provider">ارائه‌دهنده</label><select id="provider"><option value="all">همه</option></select></div><div><label for="quality">نمایش</label><select id="quality"><option value="all">همهٔ دوره‌ها</option><option value="feedback">دارای بازخورد</option><option value="missing-feedback">بازخورد نامشخص</option><option value="warnings">دارای هشدار</option><option value="missing-syllabus">سرفصل نامشخص</option></select></div></div><p id="result-count" class="muted" role="status"></p></div><div id="course-list" class="course-list"></div></aside>
<section id="course-detail" class="detail" tabindex="-1" aria-label="جزئیات دوره"><div id="detail-header"></div><div class="tabs" role="tablist" aria-label="بخش‌های دوره"><button id="tab-overview" role="tab" aria-selected="true" aria-controls="panel" data-tab="overview">نمای کلی</button><button id="tab-syllabus" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="syllabus">سرفصل‌ها</button><button id="tab-feedback" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="feedback">بازخوردها</button><button id="tab-evidence" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="evidence">منبع و هشدارها</button><button id="tab-record" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="record">رکورد داده</button></div><div id="panel" role="tabpanel" aria-labelledby="tab-overview"></div></section>
</div>
</main>
<footer>نمونهٔ موقت از صفحات عمومی ارائه‌دهندگان؛ پوشش کامل فهرست دوره‌ها یا همهٔ بازخوردها نیست. ارزیابی هوش مصنوعی انجام نشده است.</footer>
</body></html>
