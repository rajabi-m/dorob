services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: dorob
      POSTGRES_PASSWORD: dorob_dev
      POSTGRES_DB: dorob
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorob -d dorob"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  postgres_data:
