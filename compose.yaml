services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: dorob
      POSTGRES_PASSWORD: dorob_dev
      POSTGRES_DB: dorob
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorob -d dorob"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  postgres_vector_data:
